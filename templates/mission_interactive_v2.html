<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>{{ level.name }} - Protec Rescue 38</title>

    <!-- Critical: Define Context Early and Safely -->
    <script>
        try {
            window.MISSION_CONTEXT = {
                levelId: {{ level.id |default ('null') }
        },
        slug: { { level.slug | tojson | safe } },
        savedScore: { { (progress.score if progress else 0)| int } }
      };
        console.log("[Inline] Context defined:", window.MISSION_CONTEXT);
    } catch (e) {
            console.error("[Inline] Context Error:", e);
            window.MISSION_INLINE_ERROR = e.message;
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=12">
    <style>
        /* Inline styles for specific interactive mission elements */
        .mission-interactive {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .scene-container {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.5s ease-in-out, transform 1s ease-out;
        }

        .scene-image.zoomed {
            transform: scale(1.1);
        }

        .hud-top {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
        }

        .hud-status {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .pulse-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--critical);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 63, 171, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 63, 171, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 63, 171, 0);
            }
        }

        .dialogue-box {
            position: relative;
            z-index: 10;
            margin-top: auto;
            margin-bottom: 5vh;
            margin-left: auto;
            margin-right: auto;
            width: 90%;
            max-width: 800px;
            background: rgba(16, 18, 27, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
        }

        .dialogue-text {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--fg);
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 600px) {
            .choices-grid {
                grid-template-columns: 1fr;
            }
        }

        .choice-btn {
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--fg);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .choice-btn.critical {
            border-color: var(--critical);
        }

        .end-screen {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div
        style="position: fixed; top: 0; left: 0; z-index: 10000; background: black; color: lime; padding: 5px; font-weight: bold; font-family: monospace; font-size: 12px; pointer-events: none;">
        DEBUG ID: {{ level.slug }} ({{ level.id }})
        <div id="debug-log"
            style="margin-top: 5px; opacity: 0.8; max-height: 200px; overflow: hidden; background: rgba(0,0,0,0.8); width: 300px;">
        </div>
    </div>

    <div class="mission-interactive">
        <div class="scene-container">
            <img id="scene-img" src="{{ url_for('static', filename='img/mission_acr/protec_intervention_start.jpg') }}"
                class="scene-image" alt="Scène">
            <video id="scene-video" class="scene-image hidden" playsinline muted loop>
                <source src="" type="video/mp4">
            </video>
            <div class="overlay"></div>
        </div>

        <div class="hud-top">
            <a href="{{ url_for('missions_page') }}" class="btn ghost">✕ Quitter</a>
            <div class="hud-status">
                <div class="pulse-indicator"></div>
                <span class="chip" id="phase-display">Phase 1 : Approche</span>
                <span class="chip chip--pulse" id="score-display">0 pts</span>
            </div>
        </div>

        <div id="dialogue-container" class="dialogue-box">
            <h2 id="speaker-name" class="eyebrow">Chargement...</h2>
            <p id="dialogue-text" class="dialogue-text">Connexion au serveur en cours... (v2-FIX)</p>
            <div id="choices-container" class="choices-grid">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="end-screen hidden">
            <h1 id="end-title">Victoire !</h1>
            <p id="end-message" style="max-width: 600px; margin: 1rem 0 2rem; color: #ccc;">Mission terminée.</p>

            <div class="stat-grid" style="margin-bottom: 2rem; gap: 2rem; justify-content: center;">
                <div class="stat-card">
                    <p class="label">Score Final</p>
                    <p class="stat-card__value" id="end-score">100</p>
                </div>
            </div>

            <div class="cta-row">
                <button class="btn primary" onclick="location.reload()">Rejouer</button>
                <a href="{{ url_for('missions_page') }}" class="btn secondary">Retour au QG</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/mission_interactive.js') }}?v=12"></script>
</body>

</html>
